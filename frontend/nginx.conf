server {
    listen 80;
    
    # 1. Normal İstekler: React (Vite) dosyalarını sunar
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API İstekleri: Node.js konteynerine (Reverse Proxy) yönlendirir
    location /api/ {
        # docker-compose'daki API konteynerinin adı 'todo_api' idi
        
        
        # ESKİ HALİ: proxy_pass http://todo_api:3000/;
        
        # YENİ HALİ (Doğrudan servis adını kullanıyoruz):
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}